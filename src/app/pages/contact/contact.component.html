<section class="contact-hero">
  <div class="container">
    <h2>Get in Touch</h2>
    <p>Questions about our programs, communities, or partnerships? We'd love to hear from you.</p>
  </div>
</section>

<section class="contact-section">
  <div class="container contact-layout">
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" formControlName="name" type="text" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" formControlName="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" formControlName="message" rows="5" placeholder="How can we help?" required></textarea>
      </div>

      <button type="submit" class="btn-primary" [disabled]="contactForm.invalid">Send Message</button>
    </form>

    <div class="contact-info">
      <h3>Other ways to reach us</h3>
      <p>Email us directly at <a href="mailto:pathtotechng@gmail.com">pathtotechng&#64;gmail.com</a>.</p>
      <p>Or find us on Instagram and LinkedIn — links in the footer below.</p>
    </div>
  </div>
</section>
